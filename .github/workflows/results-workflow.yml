name: Scrape Race Results

on:
  schedule:
    - cron: '*/10 12-22 * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post all results (for testing)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write   # needed to relay a dispatch to engagements.yml

concurrency:
  group: results-tracking-commits
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').dependencies.playwright")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Restore France Galop session cache
        uses: actions/cache/restore@v4
        with:
          path: .fg-session.json
          key: fg-session-v2-${{ github.run_id }}
          restore-keys: fg-session-v2-

      - name: Run scraper
        env:
          RESULTS_URL: ${{ secrets.RESULTS_URL }}
          DISCORD_WEBHOOK_RESULTS: ${{ secrets.DISCORD_WEBHOOK_RESULTS }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DOC_ID: ${{ secrets.DOC_ID }}
          FRANCE_GALOP_EMAIL: ${{ secrets.FRANCE_GALOP_EMAIL }}
          FRANCE_GALOP_PASSWORD: ${{ secrets.FRANCE_GALOP_PASSWORD }}
          FORCE_POST: ${{ inputs.force_post }}
        run: node scrape_results.js

      - name: Save France Galop session cache
        if: always() && hashFiles('.fg-session.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .fg-session.json
          key: fg-session-v2-${{ github.run_id }}

      - name: Commit and push data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git fetch origin main
          git add data/seen_results.json data/race_history.json data/pending_tracking.json data/scrape_health_results.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update race results data"

          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed (attempt $i), pulling and retrying..."
            git pull --rebase origin main || git rebase --abort
            sleep 2
          done

          echo "Failed to push after 5 attempts"
          exit 1

      # GitHub's scheduled triggers are best-effort and have been dropping runs
      # for this repo — on 2026-08-27 not one of the eight engagements crons
      # fired. This workflow is dispatched reliably every 5 minutes, so it also
      # acts as a heartbeat that keeps engagements running independently of cron.
      - name: Relay dispatch to Scrape Engagements
        if: always()
        # Never let a relay problem turn this workflow red — the cron triggers
        # on engagements.yml remain in place as a backup.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 10# forces base 10 — "08" and "09" are invalid octal and would error.
          hour=$((10#$(date -u +%H)))

          # Mirror the engagements cron window (06:00-20:59 UTC). Outside it,
          # France Galop is in its overnight maintenance window and runs mostly
          # fail — that is where nearly every recent failure email came from.
          if [ "$hour" -lt 6 ] || [ "$hour" -gt 20 ]; then
            echo "Outside the engagements window (${hour}:00 UTC) — not relaying."
            exit 0
          fi

          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/engagements.yml/runs?per_page=1" \
            --jq '.workflow_runs[0].run_started_at // empty')

          if [ -n "$last" ]; then
            age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
            echo "Last Scrape Engagements run: ${last} (${age} min ago)"
            if [ "$age" -lt 55 ]; then
              echo "Ran within the last 55 minutes — not relaying."
              exit 0
            fi
          else
            echo "No prior Scrape Engagements run found."
          fi

          echo "Relaying dispatch to engagements.yml"
          gh workflow run engagements.yml --ref main
